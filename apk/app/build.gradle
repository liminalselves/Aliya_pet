plugins {
    id 'com.android.application'
}

android {
    namespace 'com.miqi.aliyapet.glass'
    compileSdk 35

    defaultConfig {
        applicationId "com.miqi.aliyapet.glass"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.2.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("syncWebAssets", Sync) {
    from("../../dist")
    into("src/main/assets/www")
}

tasks.named("preBuild") {
    dependsOn("syncWebAssets")
}

dependencies {
}
