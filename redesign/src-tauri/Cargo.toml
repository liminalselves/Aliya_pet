[package]
name = "aliya-pet"
version = "0.1.0"
description = "Aliya desktop pet (Tauri shell + Web Live2D renderer)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 透明区域鼠标穿透（GetCursorPos）+ 默认浏览器打开（ShellExecuteW，不走 cmd 元字符解析）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

# macos-private-api 在 Tauri 内部只作用于 macOS；2.11 的 manifest 校验要求
# 它与公共 app.macOSPrivateApi 同步。PNG 解码只供 macOS 模板图标使用。
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["image-png"] }

[profile.release]
panic = "abort"
lto = true
opt-level = 3
