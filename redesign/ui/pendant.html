<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Aliya 吊坠</title>
<!-- 鼠标吊坠窗口（仅 Windows）：铺满光标所在显示器的透明穿透层，见 src/pendant.ts -->
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
    -webkit-user-select: none; user-select: none;
    pointer-events: none;
  }
  #stage {
    position: fixed; inset: 0;
    opacity: 0;
  }
  #stage.visible {
    opacity: 1;
    animation: pendant-enter 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #stage.hiding {
    opacity: 0;
    animation: pendant-exit 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes pendant-enter { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pendant-exit { from { opacity: 1; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #stage.visible, #stage.hiding { animation: none; } }
  canvas { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="/core/live2dcubismcore.js"></script>
<script type="module" src="/src/pendant.ts"></script>
</body>
</html>
