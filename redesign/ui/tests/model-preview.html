<!doctype html><html lang="zh"><meta charset="utf-8"><title>模型回归预览</title>
<style>body{font:15px sans-serif;background:#e8edf4;margin:8px}iframe{width:340px;height:400px;border:0;background:#fff}button{padding:6px;margin:2px}pre{white-space:pre-wrap;max-height:70px;overflow:auto}#shots img{width:150px;background:white}figure{margin:4px}</style>
<button id="run">运行模型回归</button><button id="wave">挥手定格</button><button id="gallery">表情预览</button>
<pre id="result">等待模型加载</pre><iframe src="/"></iframe><div id="shots"></div>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('#result'),shots=document.querySelector('#shots');
const timer=setInterval(()=>{if(frame.contentWindow.__pet?._model?.isReady()){clearInterval(timer);const app=frame.contentWindow.__pet;app._running=false;app._behavior.autoActions=false;out.textContent='模型已加载，准备验证';}},100);
function env(){const a=frame.contentWindow.__pet;return [a,a._model,a._model._model]}
function advance(a,t,fps=30){for(let i=0;i<t*fps;i++)a._update(1/fps);a._render()}
function capture(a,label){a._render();const figure=document.createElement('figure');figure.style.display='inline-block';const img=new Image();img.src=a._canvas.toDataURL();const text=document.createElement('figcaption');text.textContent=label;figure.append(img,text);shots.append(figure)}
document.querySelector('#wave').onclick=()=>{const[a,p]=env();p.startExpression(null);p.playAction('wave');advance(a,1);capture(a,'挥手 1 秒')};
document.querySelector('#gallery').onclick=()=>{const[a,p]=env();shots.replaceChildren();for(const name of p.getExpressionNames()){p.startExpression(name);advance(a,3);capture(a,name)}};
document.querySelector('#run').onclick=()=>{try{const[a,p,m]=env();const ids=Array.from({length:m.getParameterCount()},(_,i)=>m.getParameterId(i));const map=new Map(ids.map(id=>[id.getString(),id]));const get=id=>m.getParameterValueById(map.get(id));const check=(v,msg)=>{if(!v)throw Error(msg)};let maxX=0,maxY=0;const names=['sway','nod','shake','doubt','wave','stretch','angry','yawn','walk'];check(p.getExpressionNames().length===12,'表情未全部加载');for(const fps of [15,30,60])for(const name of names){check(p.playAction(name),'动作加载失败 '+name);for(let i=0;i<fps*8;i++){a._update(1/fps);const b=p.getDynamicBounds();maxX=Math.max(maxX,-b.minX,b.maxX);maxY=Math.max(maxY,-b.minY,b.maxY);for(const id of ids)check(Number.isFinite(m.getParameterValueById(id)),'参数非有限');}check(get('Param30')===0&&get('Param31')===0&&get('Param36')===0,'挥手未复位 '+name)}
for(const name of p.getExpressionNames()){check(p.startExpression(name),'表情失败');advance(a,1);check([get('Param33'),get('Param34'),get('Param35')].filter(v=>v===1).length<=1,'眼型冲突')}
p.startExpression(null);p.playAction('wave');advance(a,1);check(get('Param30')===1,'挥手未开启');p.playAction('wave');advance(a,.2);p.playAction('nod');advance(a,3);check(get('Param30')===0,'打断未复位');p.setEyeOverride(true,0,0);advance(a,.1);check(get('ParamEyeLOpen')===0,'闭眼互动失败');p.setEyeOverride(false,1,1);p.setEarInteraction(true,.8,.8);p.setFaceCheek(true,.7);p.setInteractionOffsets(5,2,1,1);advance(a,.5);check(Math.abs(get('ParamCheek')-.7)<.001,'脸红互动失败');p.setEarInteraction(false,0,0);p.setFaceCheek(false,0);p.setInteractionOffsets(0,0,0,0);advance(a,4);out.textContent=JSON.stringify({status:'PASS',actions:names.length,expressions:p.getExpressionNames().length,fps:[15,30,60],parameters:m.getParameterCount(),nativeWave:!!p._chHand.nativeWave,maxX,maxY,bounds:p.getStaticBounds(),requiredMargin:Math.max(maxX/(.32*p.boundsH),maxY/(.5*p.boundsH))*1.05},null,2);capture(a,'回归结束');}catch(e){out.textContent='FAIL '+e.stack}};
</script></html>
