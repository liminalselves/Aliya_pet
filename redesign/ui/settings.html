<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Aliya 设置</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #241f26; color: #e8e2e6;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 13px;
    -webkit-user-select: none; user-select: none;
  }
  #app { height: 100%; overflow-y: auto; padding: 14px 16px 20px; box-sizing: border-box; }
  #app::-webkit-scrollbar { width: 6px; }
  #app::-webkit-scrollbar-thumb { background: #4a4048; border-radius: 3px; }

  h2 { font-size: 12px; color: #a89aa8; margin: 18px 0 8px; font-weight: normal; letter-spacing: 0.1em; }
  h2:first-child { margin-top: 2px; }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-radius: 8px; background: #2f2933; margin-bottom: 6px;
  }
  .row .label { flex: 1; }
  .row .sub { display: block; color: #8d7f8d; font-size: 11px; margin-top: 2px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  button.act {
    padding: 8px 0; border: 1px solid #4a4048; border-radius: 8px;
    background: #38303c; color: #e8e2e6; cursor: pointer; font-size: 12px;
  }
  button.act:hover { background: #453c49; }
  button.act.active {
    border-color: #7d5ba6; background: #4d3d61; color: #fff;
  }
  button.wide { width: 100%; margin-top: 6px; }

  /* 分组小标题（表情/情绪两行说明） */
  .hint { color: #8d7f8d; font-size: 11px; margin: 10px 2px 6px; }
  .hint:first-child { margin-top: 0; }

  /* 开关 */
  .sw { position: relative; width: 36px; height: 20px; flex: none; cursor: pointer; }
  .sw input { display: none; }
  .sw i {
    position: absolute; inset: 0; border-radius: 10px; background: #4a4048; transition: background .15s;
  }
  .sw i::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #cfc4cf; transition: left .15s, background .15s;
  }
  .sw input:checked + i { background: #7d5ba6; }
  .sw input:checked + i::after { left: 18px; background: #fff; }

  /* 滑块行 */
  .slider-row { display: flex; align-items: center; gap: 8px; }
  .slider-row button {
    width: 26px; height: 26px; border: 1px solid #4a4048; border-radius: 6px;
    background: #38303c; color: #e8e2e6; cursor: pointer; font-size: 14px; line-height: 1;
  }
  .slider-row input[type=range] { flex: 1; accent-color: #7d5ba6; }
  .slider-row .val { width: 40px; text-align: right; color: #a89aa8; }

  .num { width: 52px; background: #241f26; border: 1px solid #4a4048; border-radius: 6px;
         color: #e8e2e6; padding: 3px 6px; font-size: 12px; }

  .about { color: #8d7f8d; font-size: 11px; line-height: 1.8; padding: 4px 2px; }
  .about b { color: #cfc4cf; }

  /* ---------- Android 移动端适配 ---------- */
  body.platform-android { font-size: 15px; }
  body.platform-android #app { padding: 0 12px 32px; }
  .mobile-topbar { display: none; }
  body.platform-android .mobile-topbar {
    display: flex; align-items: center;
    position: sticky; top: 0; z-index: 30;
    margin: 0 -12px 6px; padding: 8px 4px 8px 4px;
    background: #241f26;
    border-bottom: 1px solid #38303c;
  }
  .mobile-topbar .back {
    width: 44px; height: 44px; padding: 0; border: none; background: none;
    color: #e8e2e6; font-size: 30px; line-height: 1; cursor: pointer;
    text-align: center; margin: 0;
  }
  .mobile-topbar .title { font-size: 17px; color: #e8e2e6; padding-left: 2px; }
  body.platform-android h2 { margin: 20px 4px 8px; font-size: 13px; }
  body.platform-android .row { padding: 14px 12px; border-radius: 12px; margin-bottom: 8px; }
  body.platform-android .row .sub { font-size: 12px; }
  body.platform-android .sw { width: 48px; height: 28px; }
  body.platform-android .sw i { border-radius: 14px; }
  body.platform-android .sw i::after { top: 3px; left: 3px; width: 22px; height: 22px; }
  body.platform-android .sw input:checked + i::after { left: 23px; }
  body.platform-android button.act { padding: 13px 0; font-size: 14px; border-radius: 12px; }
  body.platform-android .slider-row button { width: 36px; height: 36px; font-size: 18px; }
  body.platform-android .slider-row { gap: 10px; }
  body.platform-android .num { width: 64px; padding: 8px; font-size: 14px; }
  body.platform-android .grid { gap: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/settings-page.ts"></script>
</body>
</html>
